<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 680" width="1280" height="680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#0078D4"></path>
      </marker>
    </defs>

    <rect width="1280" height="680" fill="#ffffff"></rect>

    <text x="640" y="44" font-size="26" font-weight="600" fill="#1b1b1b" text-anchor="middle">VPN Remote Access Architecture</text>
    <text x="640" y="70" font-size="14" fill="#666666" text-anchor="middle">Windows Server RRAS VPN on Azure</text>

    <rect x="60" y="130" width="340" height="440" rx="10" fill="#f3f8fd" stroke="#8ab4d8" stroke-width="1.5"></rect>
    <text x="230" y="160" font-size="16" font-weight="600" fill="#0078D4" text-anchor="middle">Remote Client Network</text>
    <text x="230" y="180" font-size="12" fill="#666666" text-anchor="middle">172.16.0.0/24</text>

    <rect x="100" y="220" width="260" height="200" rx="8" fill="#ffffff" stroke="#0078D4" stroke-width="1.5"></rect>
    <g transform="translate(190,248)">
      <rect x="0" y="0" width="80" height="52" rx="3" fill="none" stroke="#0078D4" stroke-width="2.5"></rect>
      <rect x="-14" y="52" width="108" height="8" rx="3" fill="#0078D4"></rect>
    </g>
    <text x="230" y="340" font-size="15" font-weight="600" fill="#1b1b1b" text-anchor="middle">vm-vpnclient</text>
    <text x="230" y="362" font-size="12" fill="#666666" text-anchor="middle">Simulated remote employee</text>
    <text x="230" y="378" font-size="12" fill="#666666" text-anchor="middle">device</text>

    <text x="230" y="480" font-size="13" fill="#444444" text-anchor="middle">Assigned VPN address:</text>
    <text x="230" y="502" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#0078D4" text-anchor="middle">10.0.1.2</text>

    <g transform="translate(590,270)">
      <path d="M25,60 a24,24 0 0,1 0,-48 a30,30 0 0,1 58,-10 a26,26 0 0,1 5,52 z" fill="#eef3f8" stroke="#8ab4d8" stroke-width="1.5"></path>
      <text x="50" y="34" font-size="12" fill="#5a6a78" text-anchor="middle">Internet</text>
    </g>

    <line x1="402" y1="322" x2="878" y2="322" stroke="#0078D4" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"></line>
    <text x="640" y="235" font-size="14" font-weight="600" fill="#0078D4" text-anchor="middle">VPN Tunnel</text>
    <text x="640" y="254" font-size="12.5" fill="#444444" text-anchor="middle">SSTP over TCP 443, certificate secured</text>

    <rect x="880" y="130" width="340" height="440" rx="10" fill="#f3f8fd" stroke="#8ab4d8" stroke-width="1.5"></rect>
    <text x="1050" y="160" font-size="16" font-weight="600" fill="#0078D4" text-anchor="middle">vnet-vpn-lab</text>
    <text x="1050" y="180" font-size="12" fill="#666666" text-anchor="middle">10.0.0.0/16</text>

    <rect x="920" y="220" width="260" height="200" rx="8" fill="#ffffff" stroke="#0078D4" stroke-width="1.5"></rect>
    <g transform="translate(1010,246)">
      <rect x="0" y="0" width="80" height="54" rx="4" fill="none" stroke="#0078D4" stroke-width="2.5"></rect>
      <line x1="10" y1="16" x2="70" y2="16" stroke="#0078D4" stroke-width="1.5"></line>
      <line x1="10" y1="30" x2="70" y2="30" stroke="#0078D4" stroke-width="1.5"></line>
      <line x1="10" y1="44" x2="70" y2="44" stroke="#0078D4" stroke-width="1.5"></line>
      <circle cx="64" cy="16" r="1.8" fill="#0078D4"></circle>
      <circle cx="64" cy="30" r="1.8" fill="#0078D4"></circle>
      <circle cx="64" cy="44" r="1.8" fill="#0078D4"></circle>
    </g>
    <text x="1050" y="336" font-size="15" font-weight="600" fill="#1b1b1b" text-anchor="middle">vm-vpnserver</text>
    <text x="1050" y="358" font-size="12" fill="#666666" text-anchor="middle">Windows Server 2022</text>
    <text x="1050" y="374" font-size="12" fill="#666666" text-anchor="middle">RRAS + SSTP</text>

    <rect x="920" y="450" width="260" height="90" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.2"></rect>
    <text x="1050" y="476" font-size="13.5" font-weight="600" fill="#1b1b1b" text-anchor="middle">Client IP Pool</text>
    <text x="1050" y="497" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#444444" text-anchor="middle">10.0.1.1 - 10.0.1.50</text>
    <text x="1050" y="515" font-size="11.5" fill="#888888" text-anchor="middle">Static address pool</text>

    <text x="1050" y="608" font-size="12" fill="#666666" text-anchor="middle">NSG allows inbound TCP 443 (SSTP)</text>
    <text x="1050" y="626" font-size="12" fill="#666666" text-anchor="middle">and TCP 3389 (RDP mgmt)</text>
  </svg>
